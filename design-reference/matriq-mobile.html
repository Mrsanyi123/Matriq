function shortContent(c){return `<h2>What to remember</h2>${c.summary.map(s=>`<div class="key-note">${ic('check')}<span>${esc(s)}</span></div>`).join('')}`}
function practice(){return `<section class="page"><div class="page-title"><h1>${esc(t('practiceTitle'))}</h1><p>${esc(t('practiceSub'))}</p></div>${courseSwitch()}<div class="list">${courses().map((c,i)=>`<div class="chapter-row"><button class="chapter-row-main" ${action('open',`data-index="${i}"`)}><span class="chapter-num">${String(i+1).padStart(2,'0')}</span><span><strong lang="en">${esc(c.name)}</strong><small>${c.questions.length} ${esc(t('questions'))}</small></span>${ic('right')}</button><div class="row-action"><button class="text-button" ${action('open',`data-index="${i}"`)}>${ic('book','sm')}${esc(t('readFirst'))}</button><button class="text-button" ${action('quiz',`data-index="${i}"`)}>${esc(t('practice'))}${ic('arrow','sm')}</button></div></div>`).join('')}</div>${notice()}</section>`}
function quiz(){const c=ch(),q=c.questions[state.q];if(!q)return `<section class="page"><p>${esc(t('noQuestions'))}</p></section>`;return `<section class="page"><div class="quiz-progress"><span style="width:${(state.q+(state.checked?1:0))/c.questions.length*100}%"></span></div><div class="question-meta"><strong>${esc(t('question'))} ${state.q+1} / ${c.questions.length}</strong><span>${esc(t('demo'))}</span></div><h1 class="question" lang="en">${esc(q.prompt)}</h1><div class="options" role="group" aria-label="${esc(t('chooseAnswer'))}" lang="en">${q.options.map((o,i)=>`<button class="option ${i===state.selected?'selected':''} ${state.checked&&i===q.correct?'right':''} ${state.checked&&i===state.selected&&i!==q.correct?'wrong':''}" ${action('answer',`data-index="${i}"`)} aria-pressed="${state.selected===i}" ${state.checked?'disabled':''}><span class="option-key">${'ABCD'[i]}</span><span>${esc(o)}</span>${state.checked&&i===q.correct?ic('check','sm'):''}</button>`).join('')}</div>${state.hint?`<aside class="tutor" style="margin-top:20px" aria-live="polite"><strong>${ic('spark','sm')}${esc(t('hintDemo'))}</strong>${q.hints.slice(0,state.hint).map((h,i)=>`<p lang="en"><b>${i+1}.</b> ${esc(h)}</p>`).join('')}${state.hint<q.hints.length?`<button class="text-button" ${action('hint')}>${esc(t('nextHint'))}${ic('arrow','sm')}</button>`:''}</aside>`:`<button class="ai-button" ${action('hint')}>${ic('spark')}${esc(t('hint'))}<small>${esc(t('demo'))}</small></button>`}${state.checked?`<div class="feedback ${state.selected===q.correct?'':'no'}" role="status"><strong>${esc(t(state.selected===q.correct?'correct':'wrong'))}</strong><p lang="en">${esc(q.explanation)}</p></div>`:''}<div class="quiz-cta">${state.checked?button(t(state.q===c.questions.length-1?'finish':'nextQuestion'),'next'):button(t('check'),'check',state.selected===null?'disabled':'')}</div>${notice()}</section>`}
function results(){return `<section class="page"><div class="result-hero"><div class="reward-mark">${ic(state.passed?'trophy':'book')}</div><h1>${esc(t(state.passed?'goodDone':'reviewNeeded'))}</h1><p>${esc(t(state.passed?'progressSub':'tryAgain'))}</p></div><div class="result-stats"><div><b>${state.score}/${ch().questions.length}</b><small>${esc(t('questionsDone'))}</small></div><div><b>+${state.newReward?50:0}</b><small>${esc(t('xp'))}</small></div></div>${state.newReward&&done()===1?`<div class="result-card">${ic('star')}<div><strong>${esc(t('first'))}</strong><small>${esc(t('badgeDetail'))}</small></div></div>`:''}${button(t('returnMap'),'nav','data-view="learn"')}<button class="text-button" style="margin-top:15px" ${action('retry')}>${esc(t('retry'))}</button><button class="text-button" ${action('open',`data-index="${state.chapter}"`)}>${esc(t('review'))}</button><p class="sample">${esc(t('saved'))}</p></section>`}
function progress(){const n=done(),now=new Date();const week=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()-6+i);return d});const locale={en:'en',am:'am',om:'om'}[state.lang];return `<section class="page"><div class="page-title"><h1>${esc(t('progressTitle'))}</h1><p>${esc(t('progressSub'))}</p></div><div class="progress-card"><div class="progress-top"><span class="progress-orb">${ic('flame')}</span><div><h2>${streak()} <span style="font-size:16px;font-weight:600">${esc(t('days'))}</span><p>${esc(t('homeSub'))}</p></div></div><div class="days">${week.map(d=>`<span class="day"><span>${esc(d.toLocaleDateString(locale,{weekday:'narrow'}))}</span><span class="day-dot ${state.days.includes(localDate(d))?'active':''} ${localDate(d)===today()?'today':''}">${state.days.includes(localDate(d))?ic('check'):d.getDate()}</span></span>`).join('')}</div></div><div class="metrics"><div class="metric"><b>${n*50}</b><small>${esc(t('xp'))}</small></div><div class="metric"><b>${state.attempted}</b><small>${esc(t('questionsDone'))}</small></div></div><div class="section-heading"><h3>${esc(t('badges'))}</h3></div><div class="badge-list">${[['first','leaf',n>=1],['three','layers',n>=3],['week','flame',streak()>=7]].map(([k,i,earned])=>`<div class="badge-card ${earned?'earned':''}"><span class="badge-medal">${ic(i)}</span><strong>${esc(t(k))}</strong><small>${esc(t(earned?'earned':'locked'))}</small></div>`).join('')}</div><div class="section-heading"><h3>${esc(t('myChapters'))}</h3><span>${count()} / ${courses().length}</span></div>${courses().map((c,i)=>`<button class="progress-row" ${action('open',`data-index="${i}"`)}><span class="chapter-num">${state.completed[cid(i)]?ic('check','sm'):String(i+1).padStart(2,'0')}</span><span><strong lang="en">${esc(c.name)}</strong><small>${esc(t(state.completed[cid(i)]?'done':state.read[cid(i)]?'reading':'notStarted'))}</small></span>${ic('right','sm')}</button>`).join('')}<button class="settings-link" ${action('language')}><span>${ic('globe','sm')}${esc(t('appLanguage'))}</span>${ic('right','sm')}</button><p class="sample">${esc(t('saved'))}</p></section>`}
function sheet(){if(!state.sheet)return '';const lang=state.sheet==='language';return `<div class="overlay" data-overlay="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="sheet-title">${esc(t(lang?'appLanguage':'change'))}</h2><button class="icon-button" ${action('close')} aria-label="${esc(t('close'))}">${ic('close','sm')}</button></div>${lang?`<p>${esc(t('englishOnly'))}</p>${[['en','English','English'],['am','\u12a0\u121b\u122d\u129b','Amharic'],['om','Afaan Oromoo','Oromo']].map(([l,name,desc])=>`<button class="sheet-option ${state.lang===l?'selected':''}" ${action('setLang',`data-lang="${l}"`)}><span lang="${l}">${name}<br><small>${desc}</small></span>${state.lang===l?ic('check'):ic('circle')}</button>`).join('')}`:`<div class="eyebrow">${esc(t('chooseGrade'))}</div><div class="grade-grid">${[9,10,11,12].map(g=>`<button class="${state.grade===g?'active':''}" ${action('setGrade',`data-grade="${g}"`)} aria-pressed="${state.grade===g}">${g}</button>`).join('')}</div><div class="eyebrow" style="margin-bottom:12px">${esc(t('chooseSubject'))}</div>${['mathematics','physics'].map(s=>`<button class="sheet-option ${state.subject===s?'selected':''}" ${action('setSubject',`data-subject="${s}"`)}><span>${esc(t(s))}</span>${state.subject===s?ic('check'):ic('circle')}</button>`).join('')}${button(t('continue'),'close')}`}</section></div>`}
let focusReturn=null;
function render(top=true){const vp=document.querySelector('.viewport'),scroll=vp?vp.scrollTop:0;document.documentElement.lang=state.lang;document.title='Matriq - '+t(state.view==='read'?'reading':state.view==='quiz'?'practice':state.view==='result'?'progress':state.view);document.getElementById('app').innerHTML=`<div class="viewport" ${state.sheet?'inert':''}>${header()}<main id="main">${!navigator.onLine?`<p class="offline">${esc(t('offline'))}</p>`:''}${({learn:home,read:reader,practice:practice,quiz:quiz,result:results,progress:progress}[state.view]||home)()}</main></div><div ${state.sheet?'inert':''}>${navbar()}</div>${sheet()}`;document.querySelector('.viewport').scrollTop=top?0:scroll;if(state.sheet){requestAnimationFrame(()=>document.querySelector('.sheet button')?.focus({preventScroll:true}))}}
function route(){const [v,idx]=(location.hash.slice(1)||'learn').split('/');state.sheet=null;if(['learn','practice','progress','read','quiz','result'].includes(v)){state.view=v;if(idx!==undefined)state.chapter=Math.min(Math.max(0,Number(idx)||0),courses().length-1);if(['learn','practice','progress'].includes(v))state.origin=v;if(v==='quiz'&&state.q>=ch().questions.length)resetQuiz();if(v==='result'&&!state.checked){state.view='learn'}}else state.view='learn';render()}
function goto(v){if(location.hash==='#'+v){route()}else location.hash=v}
function resetQuiz(){state.q=0;state.selected=null;state.checked=false;state.score=0;state.hint=0;state.passed=false;state.newReward=false}
function startQuiz(i){state.chapter=i;resetQuiz();goto('quiz/'+i)}
function markDay(){const d=today();if(!state.days.includes(d))state.days.push(d)}
function closeSheet(){state.sheet=null;render(false);requestAnimationFrame(()=>document.querySelector(focusReturn||'.lang-btn')?.focus({preventScroll:true}))}
document.addEventListener('click',e=>{if(e.target.matches('[data-overlay]')){closeSheet();return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const i=Number(b.dataset.index);switch(b.dataset.action){case 'nav':goto(b.dataset.view);break;case 'back':goto(state.view==='quiz'?'read/'+state.chapter:state.origin);break;case 'open':state.chapter=i;state.mode='full';if(['learn','practice','progress'].includes(state.view))state.origin=state.view;goto('read/'+i);break;case 'mode':state.mode=b.dataset.mode;render(false);break;case 'start':state.read[cid(state.chapter)]=true;save();startQuiz(state.chapter);break;case 'quiz':state.origin='practice';startQuiz(i);break;case 'answer':if(!state.checked){state.selected=i;render(false)}break;case 'check':if(state.selected===null||state.checked)return;state.checked=true;state.attempted++;if(state.selected===ch().questions[state.q].correct)state.score++;markDay();save();render(false);requestAnimationFrame(()=>document.querySelector('.feedback')?.scrollIntoView({block:'nearest',behavior:'smooth'}));break;case 'hint':state.hint=Math.min(state.hint+1,ch().questions[state.q].hints.length);render(false);requestAnimationFrame(()=>document.querySelector('.tutor')?.scrollIntoView({block:'nearest',behavior:'smooth'}));break;case 'next':if(state.q<ch().questions.length-1){state.q++;state.selected=null;state.checked=false;state.hint=0;render()}else{state.passed=state.score>=Math.ceil(ch().questions.length*2/3);state.newReward=state.passed&&!state.completed[cid(state.chapter)];if(state.passed)state.completed[cid(state.chapter)]=true;save();goto('result/'+state.chapter)}break;case 'retry':startQuiz(state.chapter);break;case 'language':state.sheet='language';focusReturn='.lang-btn';render(false);break;case 'course':state.sheet='course';focusReturn='.course-switch';render(false);break;case 'close':closeSheet();break;case 'setLang':state.lang=b.dataset.lang;save();closeSheet();break;case 'setGrade':state.grade=Number(b.dataset.grade);state.chapter=0;save();render(false);break;case 'setSubject':state.subject=b.dataset.subject;state.chapter=0;save();render(false);break;}});
document.addEventListener('keydown',e=>{if(!state.sheet)return;if(e.key==='Escape'){closeSheet();return}if(e.key==='Tab'){const items=[...document.querySelectorAll('.sheet button')].filter(b=>!b.disabled);const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',route);window.addEventListener('online',()=>render(false));window.addEventListener('offline',()=>render(false));route();
</script></body></html>
